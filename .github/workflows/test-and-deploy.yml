name: test-and-deploy

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # A local hook only guards the machine it is installed on. A production
  # password reached GitHub once through a tracked file; this is the check
  # that cannot be skipped with --no-verify or missed on a fresh clone.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the pushed changes for credentials
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          added=$(git diff --no-color -U0 "$range" 2>/dev/null | grep '^+' | grep -v '^+++' || true)
          [ -z "$added" ] && exit 0

          found=$(printf '%s' "$added" \
            | grep -nE '(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp)://[^:/@[:space:]]+:[^@[:space:]]+@|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}' \
            | grep -viE '<[a-z_]+>|\$\{|example|placeholder|user:password|redacted|\*\*\*' || true)

          if [ -n "$found" ]; then
            echo "::error::A credential appears in these changes. Rotate it, then remove it from the diff."
            printf '%s' "$found" | sed -E 's#(://[^:]+:)[^@]+(@)#\1********\2#g' | cut -c1-100 | head -5
            exit 1
          fi

          echo "No credentials in the pushed changes."

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm turbo run lint

      # The step above was called "Lint & Test" but only ever ran the linter,
      # so the unit tests never ran anywhere — not in CI, and not locally
      # (the lockfile's native binaries are Linux-only). A week of WMS picking
      # regressions reached the warehouse floor through that gap.
      - name: Test
        run: pnpm turbo run test:ci

      # Ratchet gate: fails only on NEW type errors, measured against
      # scripts/typecheck-baseline.json. next.config.ts sets
      # ignoreBuildErrors, so without this nothing stops a type error
      # reaching production — which is how two admin reports shipped
      # returning 500 on every request.
      - name: Typecheck (no new errors)
        run: pnpm turbo run typecheck

      - name: Semantic Release
        run: pnpm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_AUTH_TOKEN }}

  trigger-deploy:
    needs: [check]
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install

      - name: Deploy Trigger.dev
        working-directory: apps/web
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          pnpm trigger:deploy
